[workspace]
members = [
  ".",
  "make",
]

[workspace.package]
authors = ["Daniel Mueller <deso@posteo.net>"]
edition = "2021"
license = "Apache-2.0 OR MIT"

[package]
name = "httpc"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://github.com/d-e-s-o/httpc"
description = """
An HTTP client working both natively and in WASM environments.
"""

# Not a actual examples. Used for testing. Need to be examples because
# they need access to dev-dependencies, which [[bin]] does not provide.
# [[test]] in turn contains the test harness which prints unrelated
# stuff and is unwanted for that reason.
[[example]]
name = "test-server"
path = "tests/test/server.rs"

[[example]]
name = "test-runner"
path = "tests/test/runner.rs"

[dependencies]
async-trait = "0.1.50"
bytes = "1.0"
http = "0.2"
thiserror = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper = {version = "0.14", default-features = false, features = ["client", "http1", "http2", "tcp"]}
hyper-tls = {version = "0.5", default-features = false}

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = {version = "0.3", default-features = false}
wasm-bindgen = {version = "0.2", default-features = false, features = ["std"]}
wasm-bindgen-futures = {version = "0.4", default-features = false}

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
default-features = false
features = [
  'Headers',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'Window',
]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = "1.0"
tokio = {version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"]}
warp = {version = "0.3", default-features = false}
wasm-bindgen-cli = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
